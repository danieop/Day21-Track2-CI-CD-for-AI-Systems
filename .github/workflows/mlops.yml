name: MLOps Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/mlops.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      model_key: ${{ steps.model_key.outputs.model_key }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.SPACES_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.SPACES_SECRET_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ secrets.SPACES_REGION }}" >> $GITHUB_ENV
          echo "SPACES_REGION=${{ secrets.SPACES_REGION }}" >> $GITHUB_ENV
          echo "SPACES_ENDPOINT_URL=https://${{ secrets.SPACES_REGION }}.digitaloceanspaces.com" >> $GITHUB_ENV
          echo "SPACES_BUCKET=${{ secrets.CLOUD_BUCKET }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Check data drift
        run: python -m src.drift

      - name: Emit drift warning
        run: |
          python - <<'EOF'
          import json

          with open("outputs/drift_report.json") as f:
              report = json.load(f)

          if report["drift_detected"]:
              features = ", ".join(report["drifted_features"])
              print(f"::warning title=Data drift detected::Drifted features: {features}")
          else:
              print("No data drift detected.")
          EOF

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"

      - name: Generate performance report
        run: python -m src.report

      - name: Prepare versioned model key
        id: model_key
        run: echo "model_key=models/runs/${GITHUB_SHA}/model.pkl" >> "$GITHUB_OUTPUT"

      - name: Upload versioned model to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["SPACES_BUCKET"]
          endpoint_url = os.environ["SPACES_ENDPOINT_URL"]
          region = os.environ["SPACES_REGION"]
          key = "models/runs/{}/model.pkl".format(os.environ["GITHUB_SHA"])

          s3 = boto3.client("s3", endpoint_url=endpoint_url, region_name=region)
          s3.upload_file("models/model.pkl", bucket, key)
          print(f"Uploaded model to s3://{bucket}/{key}")
          EOF

      - name: Save reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-reports
          path: |
            outputs/metrics.json
            outputs/drift_report.json
            outputs/performance_report.md


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong.
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          threshold = 0.70
          if acc < threshold:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < {threshold:.2f}. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= {threshold:.2f}. Dang trien khai model.")
          EOF

  # ---------------------------------------------------------------------------
  # JOB 4 - PROMOTE
  # Chi promote model thanh latest sau khi qua eval gate.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote latest model
    needs: [train, eval]
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Cloud Storage
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.SPACES_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.SPACES_SECRET_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ secrets.SPACES_REGION }}" >> $GITHUB_ENV
          echo "SPACES_REGION=${{ secrets.SPACES_REGION }}" >> $GITHUB_ENV
          echo "SPACES_ENDPOINT_URL=https://${{ secrets.SPACES_REGION }}.digitaloceanspaces.com" >> $GITHUB_ENV
          echo "SPACES_BUCKET=${{ secrets.CLOUD_BUCKET }}" >> $GITHUB_ENV

      - name: Copy versioned model to latest
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["SPACES_BUCKET"]
          endpoint_url = os.environ["SPACES_ENDPOINT_URL"]
          region = os.environ["SPACES_REGION"]
          source_key = "${{ needs.train.outputs.model_key }}"
          latest_key = "models/latest/model.pkl"

          s3 = boto3.client("s3", endpoint_url=endpoint_url, region_name=region)
          s3.copy_object(
              Bucket=bucket,
              CopySource={"Bucket": bucket, "Key": source_key},
              Key=latest_key,
          )
          print(f"Promoted s3://{bucket}/{source_key} -> s3://{bucket}/{latest_key}")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 5 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi model da duoc promote thanh latest.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload serving code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "src/serve.py"
          target: "/root/"
          strip_components: 0

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p ~/models
            sudo systemctl restart mlops-serve
            for i in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            sudo journalctl -u mlops-serve -n 80 --no-pager
            exit 1
