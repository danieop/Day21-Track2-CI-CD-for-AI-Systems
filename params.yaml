# Chay nhieu thuat toan va chon model co accuracy/F1 tot nhat.
model_type: random_forest
experiments:
  - random_forest
  - gradient_boosting
  - logistic_regression

random_forest:
  n_estimators: 200
  max_depth:
  min_samples_split: 2
  min_samples_leaf: 1
  criterion: gini
  max_features: 0.5
  class_weight: balanced_subsample
  random_state: 27
  n_jobs: -1

gradient_boosting:
  n_estimators: 120
  learning_rate: 0.08
  max_depth: 3
  min_samples_split: 2
  min_samples_leaf: 1
  subsample: 0.9
  random_state: 27

logistic_regression:
  C: 1.0
  solver: lbfgs
  max_iter: 1000
  class_weight: balanced
  random_state: 27
